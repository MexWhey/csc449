name: Java CI — Run Unit Tests
 
# Trigger: run on every push to any branch, and on every pull request into main
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest
 
    steps:
      # 1. Check out the repository so the workflow can see the code
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # 2. Install Java 17 (matches the version set in pom.xml)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
 
      # 3. Cache Maven dependencies so builds are faster after the first run
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
 
      # 4. Compile the project and run all unit tests
      #    'mvn test' compiles src/main and src/test, then runs every *Test.java file
      - name: Run unit tests with Maven
        run: mvn test --batch-mode
 
      # 5. Upload the Surefire test report as a downloadable artifact
      #    This is what you screenshot and send to your instructor
      #    Always upload even if tests fail, so you can see what went wrong
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-report
          path: target/surefire-reports/
 
